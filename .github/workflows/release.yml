name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon runner
            args: ''
          - platform: 'ubuntu-22.04' # Linux runner (AppImage is built and fixed separately below)
            args: '--bundles deb,rpm'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sonora v__VERSION__'
          releaseBody: 'See the assets to download the release for your platform.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's AppImage ships AppRun.wrapped as 0770, which fails for any user other
      # than the owner (AppImageHub's firejail test). Build it here, fix permissions,
      # and upload it with a .sha256. An AppImage already on the release (uploaded and
      # launch-tested by hand) is never replaced.
      - name: Build AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: npx tauri build --bundles appimage

      - name: Fix AppImage permissions and upload
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle/appimage
          for f in *.AppImage; do
            bash "$GITHUB_WORKSPACE/scripts/fix-appimage-perms.sh" "$f"
            sha256sum "$f" > "$f.sha256"
            if gh release view "${{ github.ref_name }}" --json assets -q '.assets[].name' | grep -qx "$f"; then
              echo "$f already on the release; not replacing it"
            else
              gh release upload "${{ github.ref_name }}" "$f" "$f.sha256"
            fi
          done
