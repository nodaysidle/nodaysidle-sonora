<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="50%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Lime Glow Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4FF4D"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base for macOS App Icon Style -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Acoustic Vinyl Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="rgba(200,255,0,0.12)" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Sonora Central Soundwave & Stylized "S" Dynamic Bars -->
  <g filter="url(#glow)">
    <!-- Central Sound Wave Bars -->
    <rect x="156" y="216" width="16" height="80" rx="8" fill="url(#limeGrad)" opacity="0.6"/>
    <rect x="188" y="176" width="16" height="160" rx="8" fill="url(#limeGrad)" opacity="0.8"/>
    <rect x="220" y="136" width="16" height="240" rx="8" fill="url(#limeGrad)"/>
    <rect x="252" y="116" width="16" height="280" rx="8" fill="#FFFFFF"/>
    <rect x="284" y="156" width="16" height="200" rx="8" fill="url(#limeGrad)"/>
    <rect x="316" y="186" width="16" height="140" rx="8" fill="url(#limeGrad)" opacity="0.8"/>
    <rect x="348" y="226" width="16" height="60" rx="8" fill="url(#limeGrad)" opacity="0.6"/>
  </g>

  <!-- Minimalist Orbit Arc -->
  <path d="M 120 256 A 136 136 0 0 1 380 180" fill="none" stroke="url(#limeGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>
